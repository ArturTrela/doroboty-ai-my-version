project_id = "doroboty-ai-local"
[api]
enabled = true
port = 58321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 58322
shadow_port = 58320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 58323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 58324
[auth]
enabled = true
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = ["http://127.0.0.1:3001/**", "http://localhost:3001/**", "http://127.0.0.1:3107/**"]
enable_signup = true
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
max_frequency = "1s"
[auth.email.template.confirmation]
subject = "Potwierdź konto DoRoboty.ai"
[auth.email.template.recovery]
subject = "Zresetuj hasło DoRoboty.ai"
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
[storage]
enabled = true
file_size_limit = "5MiB"
[realtime]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
